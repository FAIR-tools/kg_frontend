name: base
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdflib
  - pyyaml
  - graphviz
  - python-graphviz
  - ase
  - networkx
  - pandas
  - mp-api
  - sqlalchemy
  - spglib
  - mendeleev
  - pymatgen=2025.6.14   # 2026.x dropped StructureGraph.with_empty_graph, which crystal-toolkit still calls
  - fastapi
  - uvicorn
  - python-multipart
  - setuptools<81
  - pip
  - pip:
    - atomman
    - aimsgb
    - crystal-toolkit
    - groq
