# nginx site config for the atomRDF knowledge graph.
#
# Install to /etc/nginx/conf.d/atomrdf.conf, then run certbot (see DEPLOY.md).
# This is the PRE-TLS form: `certbot --nginx` injects the `listen 443 ssl`,
# `ssl_certificate`, `options-ssl-nginx` and `ssl_dhparam` lines into the server
# blocks below and adds the http->https redirect. Keep this file as the source
# of truth for everything EXCEPT those injected lines.
#
# Hostnames (all three point at the same instance):
#   atomkg.pyscal.org      CANONICAL — instance IRIs are minted here
#   matkg.pyscal.org       alias, cited by the notebooks and README
#   atomrdfkg.pyscal.org   alias
#
# Why a canonical host: instance IRIs look like
# https://atomkg.pyscal.org/id/sample/<uuid> and must dereference. An entity has
# exactly ONE identifier, so /id/* on the aliases is redirected to the canonical
# host rather than served there -- otherwise the same sample would carry three
# IRIs and no consumer could tell they are the same thing.

server {
    listen 80;
    listen [::]:80;
    server_name atomkg.pyscal.org;

    client_max_body_size 50M;

    # SPARQL and RDF payloads compress extremely well; worth it on a 1 OCPU box.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/sparql-results+json application/sparql-results+xml
               text/turtle application/ld+json application/n-triples;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Analytic SPARQL over ~2.8M triples can be slow on one core.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering       off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name matkg.pyscal.org atomrdfkg.pyscal.org;

    client_max_body_size 50M;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/sparql-results+json application/sparql-results+xml
               text/turtle application/ld+json application/n-triples;

    # Identity belongs to the canonical host only.
    location /id/ {
        return 301 https://atomkg.pyscal.org$request_uri;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering       off;
    }
}

# After certbot has run it creates an http->https redirect server block. Keep an
# explicit ACME-challenge location ahead of that redirect so a misconfigured
# redirect can never break renewal:
#
#   location ^~ /.well-known/acme-challenge/ {
#       root /var/www/html;
#       default_type "text/plain";
#       try_files $uri =404;
#   }
#
# GOTCHA: `ipv6only=on` may appear only ONCE per address:port across the entire
# nginx config. Certbot adds it to the first block it touches; if you hand-edit a
# second block to add `listen [::]:443 ssl ipv6only=on;` nginx refuses to start
# with "duplicate listen options for [::]:443".
