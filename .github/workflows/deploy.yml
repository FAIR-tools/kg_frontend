name: Deploy Frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - "environment.yml"
      - "Dockerfile.base"
  workflow_run:
    workflows: ["Build Base Image"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read   # allows GITHUB_TOKEN to pull from GHCR

    steps:
      - name: Deploy to VM (fast — only rebuilds app layer)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            set -e

            echo "── Pulling latest kg_frontend source ──"
            cd ~/kg_frontend
            git fetch origin main
            git reset --hard origin/main

            echo "── Logging in to GHCR ──"
            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "── Pulling latest base image ──"
            docker pull ghcr.io/fair-tools/kg_frontend_base:latest

            echo "── Rebuilding app layer and restarting ──"
            docker compose down --remove-orphans
            docker compose up --build -d

            echo "── Waiting for health check ──"
            for i in $(seq 1 12); do
              sleep 10
              curl -sf http://localhost:8000/api/samples > /dev/null && echo "✓ App is healthy" && break
              echo "  attempt $i/12 — still starting…"
            done
            echo "── Container logs ──"
            docker compose logs app --tail 30
