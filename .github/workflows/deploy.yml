name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM (fast — only rebuilds app layer)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            echo "── Pulling latest kg_frontend source ──"
            cd ~/kg_frontend
            git pull origin main

            echo "── Pulling latest base image ──"
            docker pull ghcr.io/fair-tools/kg_frontend_base:latest

            echo "── Rebuilding app layer and restarting ──"
            docker compose up --build -d

            echo "── Waiting for health check ──"
            sleep 10
            curl -sf http://localhost:8000/api/samples > /dev/null && echo "✓ App is healthy" || echo "✗ Health check failed"
